name: Package Community preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Preview version, for example 1.3.0-preview.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  posix-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare POSIX preview assets
        run: |
          mkdir -p dist/installers
          cp installers/community/install.sh dist/installers/install.sh
          cp installers/community/bin/bestrong dist/installers/bestrong-posix
          chmod +x dist/installers/install.sh dist/installers/bestrong-posix

      - name: Upload POSIX preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeStrongHQ-Community-POSIX-${{ inputs.version }}
          path: dist/installers/*

  windows-preview-zip:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Windows preview ZIP
        shell: pwsh
        run: installers/community/windows/build-preview-zip.ps1 -Version "${{ inputs.version }}"

      - name: Upload Windows preview ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeStrongHQ-Community-Windows-Preview-${{ inputs.version }}
          path: dist/installers/*.zip
