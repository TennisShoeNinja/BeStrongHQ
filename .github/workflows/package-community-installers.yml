name: Package Community early installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version, for example 1.3.0-early.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  posix-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare POSIX installer assets
        run: |
          mkdir -p dist/installers
          cp installers/community/install.sh dist/installers/install.sh
          cp installers/community/bin/bestrong dist/installers/bestrong-posix
          chmod +x dist/installers/install.sh dist/installers/bestrong-posix

      - name: Upload POSIX installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeStrongHQ-Community-POSIX-${{ inputs.version }}
          path: dist/installers/*

  windows-installer-zip:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Windows early installer ZIP
        shell: pwsh
        run: installers/community/windows/build-windows-zip.ps1 -Version "${{ inputs.version }}"

      - name: Upload Windows early installer ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeStrongHQ-Community-Windows-${{ inputs.version }}
          path: dist/installers/*.zip
