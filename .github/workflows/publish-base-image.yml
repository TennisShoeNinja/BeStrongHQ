name: Publish Docker base image

# Builds the `system-base` stage of docker/Dockerfile and publishes
# it to GitHub Container Registry. The private cloud Dockerfile FROMs
# this image, so it has to exist on a registry before any cloud
# deploy can run. Re-publishes whenever the public Dockerfile (or
# this workflow) changes; can also be triggered manually.

on:
  push:
    branches: [main]
    paths:
      - 'docker/Dockerfile'
      - '.github/workflows/publish-base-image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tennisshoeninja/bestrong-hq-base

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # NOTE: action versions left as major-version tags here.
      # Dependabot's github-actions ecosystem rule (.github/dependabot.yml)
      # will pin them to commit SHAs on the next weekly run, matching
      # the style of ci.yml. Manually SHA-pin sooner if you'd rather.
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU (multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push system-base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: system-base
          push: true
          # amd64 covers Mac Intel, Windows, most Linux servers (your VPS).
          # arm64 covers Apple Silicon Macs and Raspberry Pi.
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
